<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Roomi · 伴侣空间</title>
<style>
  :root {
    --bg: #fdfeff;
    --bg-sub: #f5f8fc;
    --surface: #ffffff;
    --surface-muted: #ebf0f8;
    --border: #e4ebf5;
    --border-strong: #d3deef;
    --text: #1c2433;
    --text-2: #3d485c;
    --text-muted: #6e7a91;
    --text-dim: #9aa5b8;
    --blue: #5b8def;
    --blue-hover: #487be0;
    --blue-soft: #eef4fd;
    --blue-bubble: #edf3fc;
    --blue-border: rgba(91, 141, 239, 0.25);
    --green: #10b981;
    --green-soft: #ecfdf5;
    --red: #ef4444;
    --radius-lg: 18px;
    --radius-md: 14px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-composer: 0 4px 20px rgba(15, 23, 42, 0.06);
    --shadow-float: 0 10px 30px rgba(15, 23, 42, 0.10);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --app-height: 100dvh;
    --header-bg: rgba(253, 254, 255, 0.92);
    --avatar-grad: linear-gradient(135deg, #6896f2 0%, #92b5f7 100%);
  }

  /* Claude App Warm Paper Minimal Theme */
  [data-theme="claude"] {
    --bg: #faf9f5;
    --bg-sub: #f2efe7;
    --surface: #ffffff;
    --surface-muted: #ebe7dc;
    --border: #e5e0d4;
    --border-strong: #d3ccbc;
    --text: #1f1e1b;
    --text-2: #49453e;
    --text-muted: #767065;
    --text-dim: #a19a8d;
    --blue: #d97757;
    --blue-hover: #c56242;
    --blue-soft: #fdf2ee;
    --blue-bubble: #efeae0;
    --blue-border: rgba(217, 119, 87, 0.28);
    --header-bg: rgba(250, 249, 245, 0.92);
    --avatar-grad: linear-gradient(135deg, #d97757 0%, #e69679 100%);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #eef1f6; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app-shell {
    position: relative;
    width: 100%; height: var(--app-height);
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 520px) {
    body { display: flex; align-items: center; justify-content: center; }
    .app-shell {
      width: 416px; height: min(868px, 94dvh);
      border-radius: 30px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
    }
  }

  /* Header — Clean White-Blue / Warm Paper Top Bar */
  .header {
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 20;
    flex-shrink: 0;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .companion-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    position: relative;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--avatar-grad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px; color: #fff; flex-shrink: 0;
  }
  .avatar::after {
    content: ""; position: absolute; right: 0; bottom: 0;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); border: 2px solid #fff;
  }
  .companion-meta { min-width: 0; }
  .companion-name-row { display: flex; align-items: center; gap: 6px; }
  .companion-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .mode-badge {
    font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-muted); color: var(--text-muted);
    border: 1px solid var(--border);
    max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mode-badge.live {
    background: var(--blue-soft); color: var(--blue);
    border-color: var(--blue-border);
  }
  .companion-sub {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .heart-pill { color: var(--blue); font-weight: 500; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.16s;
  }
  .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
  .icon-btn:active { transform: scale(0.94); }

  /* Minimal Segmented Pill Switcher */
  .tabs {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface-muted);
    padding: 3px; border-radius: 11px;
  }
  .tab-indicator {
    position: absolute; top: 3px; left: 3px;
    width: calc(50% - 3px); height: calc(100% - 6px);
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .tabs[data-active="1"] .tab-indicator { transform: translateX(100%); }
  .tab-btn {
    position: relative; z-index: 1;
    border: none; background: transparent; color: var(--text-muted);
    font-size: 13px; font-weight: 500; padding: 6px 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color 0.18s;
    outline: none;
  }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--blue-border); outline-offset: 1px; }
  .tab-btn.active { color: var(--text); font-weight: 600; }
  .tab-count {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: rgba(15, 23, 42, 0.06); color: var(--text-muted);
    font-weight: 500;
  }
  .tab-btn.active .tab-count { background: var(--blue-soft); color: var(--blue); }
  .unread-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
    display: none;
  }
  .unread-dot.show { display: inline-block; }

  /* Floating Reply Toast */
  .floating-banner {
    position: absolute; top: calc(102px + var(--safe-top)); left: 14px; right: 14px;
    z-index: 40; padding: 10px 14px; border-radius: 14px;
    background: #ffffff;
    border: 1px solid var(--blue-border);
    box-shadow: var(--shadow-float);
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    transform: translateY(-14px); opacity: 0; pointer-events: none;
    transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .floating-banner.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .floating-banner-text {
    font-size: 13px; line-height: 1.4; color: var(--text); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .floating-banner-cta { font-size: 12px; color: var(--blue); flex-shrink: 0; font-weight: 600; }

  /* Storage / Runtime Warning */
  .warn-toast {
    position: absolute; bottom: 112px; left: 14px; right: 14px;
    z-index: 45; padding: 9px 13px; border-radius: 12px;
    background: #fef2f2; border: 1px solid #fecaca;
    color: #b91c1c; font-size: 12px; line-height: 1.4;
    box-shadow: var(--shadow-sm);
    display: none; align-items: center; justify-content: space-between; gap: 8px;
  }
  .warn-toast.show { display: flex; }
  .warn-toast.info {
    background: var(--surface); border-color: var(--border-strong); color: var(--text-2);
    box-shadow: var(--shadow-float);
  }

  /* Dual-Pane Horizontal Viewport */
  .viewport { flex: 1; width: 100%; overflow: hidden; position: relative; touch-action: pan-y; }
  .track {
    display: flex; width: 200%; height: 100%;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .track.dragging { transition: none; }
  .pane {
    width: 50%; flex: 0 0 50%; min-width: 0; height: 100%;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .pane-board { background: var(--bg-sub); }

  /* LEFT PANE: Chat (DeepSeek Clean White Style) */
  .chat-scroll {
    flex: 1; overflow-y: auto; padding: 16px 16px 12px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    background: var(--bg);
  }
  .chat-scroll::-webkit-scrollbar, .board-scroll::-webkit-scrollbar { width: 4px; }
  .chat-scroll::-webkit-scrollbar-thumb, .board-scroll::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.12); border-radius: 4px;
  }

  .msg-row { display: flex; flex-direction: column; max-width: 86%; animation: popIn 0.18s ease; }
  .msg-row.ai { align-self: flex-start; max-width: 90%; }
  .msg-row.user { align-self: flex-end; }
  .msg-row.event { align-self: center; max-width: 92%; }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ai-row-wrap { display: flex; align-items: flex-start; gap: 9px; }
  .ai-mini-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--blue-soft); color: var(--blue);
    border: 1px solid var(--blue-border);
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }

  .bubble {
    font-size: 14.5px; line-height: 1.62;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg-row.ai .bubble {
    padding: 8px 13px;
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 6px 16px 16px 16px;
    color: var(--text);
  }
  .msg-row.user .bubble {
    padding: 10px 14px;
    background: var(--blue-bubble);
    border: 1px solid rgba(77, 107, 254, 0.14);
    border-radius: 16px 16px 4px 16px;
    color: var(--text);
  }
  .msg-row.streaming .bubble::after {
    content: " ▍";
    color: var(--blue);
    animation: blink 0.9s infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .event-pill {
    font-size: 11px; color: var(--text-muted);
    background: var(--bg-sub);
    border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* Widget Spawn Card inside Chat */
  .spawn-card {
    margin-left: 35px;
    padding: 11px 14px;
    background: #ffffff;
    border: 1px solid var(--blue-border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; transition: border-color 0.16s, background 0.16s;
  }
  .spawn-card:hover { background: var(--blue-bubble); border-color: var(--blue); }
  .spawn-meta { min-width: 0; }
  .spawn-tag { font-size: 10px; color: var(--blue); font-weight: 600; letter-spacing: 0.2px; }
  .spawn-title { font-size: 13.5px; font-weight: 600; margin-top: 2px; color: var(--text); }
  .spawn-go {
    padding: 5px 11px; border-radius: 999px;
    background: var(--blue-soft); color: var(--blue);
    font-size: 12px; font-weight: 600; flex-shrink: 0;
  }

  /* Typing Indicator */
  .typing-row {
    align-self: flex-start; display: none; align-items: center; gap: 8px;
    padding: 8px 13px; border-radius: 14px;
    background: var(--bg-sub); border: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
  }
  .typing-row.show { display: inline-flex; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--blue);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Quick Prompt Chips */
  .quick-bar {
    display: flex; gap: 7px; overflow-x: auto;
    padding: 6px 14px 8px; flex-shrink: 0;
    background: var(--bg);
    scrollbar-width: none;
  }
  .quick-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-size: 12px; color: var(--text-2);
    background: #ffffff; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    transition: all 0.16s;
  }
  .chip:hover { color: var(--blue); border-color: var(--blue-border); background: var(--blue-soft); }

  /* Floating Pill Composer — DeepSeek App Signature */
  .composer-wrap {
    padding: 2px 12px calc(12px + var(--safe-bottom));
    background: var(--bg);
    flex-shrink: 0;
  }
  .composer {
    background: #ffffff;
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 7px 7px 7px 16px;
    box-shadow: var(--shadow-composer);
    display: flex; align-items: flex-end; gap: 10px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .composer:focus-within {
    border-color: var(--blue);
    box-shadow: 0 4px 22px rgba(77, 107, 254, 0.10);
  }
  .composer textarea {
    flex: 1; min-height: 22px; max-height: 112px;
    resize: none; border: none; background: transparent;
    color: var(--text); padding: 6px 0;
    font-size: 14.5px; line-height: 1.45; font-family: inherit;
    outline: none;
  }
  .composer textarea::placeholder { color: var(--text-dim); }
  .img-pick-btn {
    width: 32px; height: 34px; border: none; border-radius: 50%;
    background: transparent; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: color 0.16s, background 0.16s, opacity 0.16s;
  }
  .img-pick-btn:hover { background: var(--surface-muted); color: var(--blue); }
  .img-pick-btn.unsupported { opacity: 0.42; color: var(--text-dim); }
  .img-preview-bar {
    display: none; align-items: center; gap: 10px;
    padding: 6px 10px; margin-bottom: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-sm);
  }
  .img-preview-bar.show { display: flex; }
  .img-preview-thumb {
    width: 42px; height: 42px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .img-preview-meta { flex: 1; font-size: 11.5px; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bubble-img {
    display: block; max-width: 220px; max-height: 240px;
    border-radius: 11px; object-fit: cover; cursor: zoom-in;
    border: 1px solid rgba(15, 23, 42, 0.08);
  }
  .bubble-img + .bubble-text { margin-top: 6px; }
  .img-lightbox {
    position: absolute; inset: 0; z-index: 70;
    background: rgba(15, 23, 42, 0.86);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .img-lightbox.show { opacity: 1; visibility: visible; pointer-events: auto; }
  .img-lightbox img { max-width: 100%; max-height: 86dvh; border-radius: 14px; object-fit: contain; }

  .send-btn {
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.16s, transform 0.14s, opacity 0.16s;
  }
  .send-btn:hover:not(:disabled) { background: var(--blue-hover); }
  .send-btn:active:not(:disabled) { transform: scale(0.93); }
  .send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .send-btn.stop { background: #1e293b; }

  /* RIGHT PANE: Clean Light Widget Board */
  .board-scroll {
    flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden;
    padding: 14px 14px calc(24px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 12px;
    overscroll-behavior-y: contain;
  }
  .board-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 15px; border-radius: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .board-hero-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .board-hero-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .new-widget-btn {
    border: none; padding: 7px 12px; border-radius: 999px;
    background: var(--blue-soft); color: var(--blue);
    font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .new-widget-btn:hover { background: #e0e7ff; }

  .widget-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    animation: popIn 0.22s ease;
  }
  .widget-card.highlight {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.14);
  }
  .widget-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #fafbfd;
  }
  .widget-title-wrap { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .widget-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .widget-title { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .widget-actions { display: flex; gap: 2px; }
  .mini-btn {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 11px; padding: 4px 7px; border-radius: 7px; cursor: pointer;
  }
  .mini-btn:hover { background: var(--surface-muted); color: var(--text); }
  .mini-btn.danger:hover { background: #fef2f2; color: var(--red); }
  .widget-frame {
    width: 100%; border: none; display: block;
    background: #ffffff;
    transition: height 0.2s ease;
  }

  .empty-board {
    text-align: center; padding: 44px 20px; color: var(--text-muted);
    background: #ffffff;
    border: 1px dashed var(--border-strong); border-radius: 18px;
  }

  /* Modal (Light Sheet — GPU flicker-free on Android WebView) */
  .modal-backdrop {
    position: absolute; inset: 0; z-index: 60;
    background: rgba(15, 23, 42, 0.42);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .modal-backdrop.show {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  .modal-sheet {
    width: 100%; max-height: 86%; overflow-y: auto;
    background: #ffffff; border-top: 1px solid var(--border);
    border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(22px + var(--safe-bottom));
    box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.12);
    transform: translateY(28px);
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .modal-backdrop.show .modal-sheet {
    transform: translateY(0);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--border-strong);
    background: var(--bg-sub); color: var(--text);
    border-radius: 11px; padding: 9px 12px; font-size: 13px;
    font-family: inherit; outline: none; transition: border-color 0.16s, background 0.16s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--blue); background: #fff; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .preset-btn {
    font-size: 11px; padding: 5px 10px; border-radius: 999px;
    background: var(--bg-sub); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
  }
  .preset-btn:hover { color: var(--blue); border-color: var(--blue-border); background: var(--blue-soft); }
  .preset-btn.active { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); font-weight: 600; }
  .field-label-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 5px; gap: 8px;
  }
  .field-label-row label { margin-bottom: 0; }
  .detect-btn {
    border: 1px solid var(--border); background: var(--bg-sub); color: var(--blue);
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    cursor: pointer; transition: all 0.16s;
  }
  .detect-btn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }

<script>
(() => {
  const STORE_KEY = 'loom_companion_proto_v1';
  const IDB_NAME = 'LoomCompanionDB';
  const IDB_STORE = 'kv';
  const DEFAULT_PERSONA = '你是用户的专属伴侣“林澈”，温柔中带点嘴硬和幽默感，说话像微信日常聊天，绝不说教、不用列表腔。你很宠用户，同时会督促对方好好吃饭和早睡。';

  const SEND_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>`;
  const STOP_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"></rect></svg>`;

  // ---- Async Storage Adapter ----
  const StorageAdapter = (() => {
    let dbPromise = null;

    function openDB() {
      if (!('indexedDB' in window)) return Promise.reject(new Error('No IndexedDB'));
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IDB open failed'));
      });
      return dbPromise;
    }

    async function get(key) {
      try {
        const db = await openDB();
        const val = await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        if (val !== undefined && val !== null) return val;
      } catch {}

      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const parsed = JSON.parse(raw);
          await set(key, parsed).catch(() => {});
          return parsed;
        }
      } catch {}
      return null;
    }

    async function set(key, value) {
      let idbOk = false;
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(reqErrorOrDefault(tx.error));
        });
        idbOk = true;
      } catch {}

      if (idbOk) return;
      localStorage.setItem(key, JSON.stringify(value));
    }

    function reqErrorOrDefault(err) {
      return err || new Error('IDB write error');
    }

    async function remove(key) {
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch {}
      try { localStorage.removeItem(key); } catch {}
    }

    return { get, set, remove };
  })();

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // ---- Starter Widget (Light White-Blue Clean Theme) ----
  const STARTER_WIDGET = {
    id: 'starter_checkin',
    title: '今日贴贴 & 喝水提醒',
    height: 178,
    createdAt: Date.now(),
    html: `<style>
      body { font-family: -apple-system, sans-serif; color: #111827; margin: 0; padding: 14px; background: #ffffff; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .count { font-size: 24px; font-weight: 700; color: var(--w-accent, #4d6bfe); }
      .sub { font-size: 12px; color: #6b7280; }
      .cups { display: flex; gap: 6px; margin: 10px 0 14px; }
      .cup { flex: 1; height: 24px; border-radius: 7px; background: var(--w-muted, #f2f4f8); border: 1px solid var(--w-border, #e6e9f0); cursor: pointer; transition: .18s; }

  function applyTrackOffset(page, dragDeltaPx = 0) {
    if (dragDeltaPx === 0) {
      track.style.transform = page === 1 ? 'translateX(-50%)' : 'translateX(0)';
      return;
    }
    const paneWidth = viewport.clientWidth || 1;
    const basePx = -page * paneWidth;
    const clamped = Math.max(-paneWidth, Math.min(0, basePx + dragDeltaPx));
    track.style.transform = `translateX(${clamped}px)`;

    applyTrackOffset(page, 0);
    tabBar.setAttribute('data-active', String(page));
    tabBar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.tab) === page);

      boardDot.classList.remove('show');
      if (highlightWidgetId) {
        const card = document.querySelector(`[data-widget-card="${highlightWidgetId}"]`);
        if (card) {
          const targetTop = Math.max(0, card.getBoundingClientRect().top - boardScroll.getBoundingClientRect().top + boardScroll.scrollTop - 14);
          boardScroll.scrollTo({ top: targetTop, behavior: 'smooth' });

  let touchStartX = 0, touchStartY = 0, isHorizDragging = false, skipSwipe = false;
  viewport.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    if (e.target.closest('.quick-bar, textarea, input, button')) {
      skipSwipe = true;
      return;
    }
    skipSwipe = false;
    isHorizDragging = false;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  viewport.addEventListener('touchmove', e => {
    if (skipSwipe || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (!isHorizDragging) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        isHorizDragging = true;
        track.classList.add('dragging');
      } else if (Math.abs(dy) > 14) {
        skipSwipe = true;
        return;
      }
    }
    if (isHorizDragging) applyTrackOffset(currentPage, dx);

  viewport.addEventListener('touchend', e => {
    if (skipSwipe || !isHorizDragging || !e.changedTouches.length) {

      return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const threshold = Math.min(72, (viewport.clientWidth || 360) * 0.22);
    if (dx < -threshold && currentPage === 0) switchPage(1);
    else if (dx > threshold && currentPage === 1) switchPage(0);

    isHorizDragging = false;

  // ---- Sandboxed Widget Srcdoc (Light White-Blue Baseline + Strict CSP) ----
  function sanitizeWidgetHtml(rawHtml) {
    return String(rawHtml || '')
      .replace(/<\/body\s*>/gi, '<!-- /body -->')
      .replace(/<\/html\s*>/gi, '<!-- /html -->');
  }

  function buildWidgetSrcdoc(widget) {
    const initialStateJson = JSON.stringify(state.widgetStates[widget.id] || {}).replace(/</g, '\\u003c');
    const safeId = JSON.stringify(widget.id).replace(/</g, '\\u003c');
    const safeTitle = JSON.stringify(widget.title).replace(/</g, '\\u003c');
    const bodyHtml = sanitizeWidgetHtml(widget.html);
    const isClaude = state.settings.theme === 'claude';
    const wAccent = isClaude ? '#d97757' : '#5b8def';
    const wSoft = isClaude ? '#fdf2ee' : '#eef4fd';
    const wMuted = isClaude ? '#f3f1ea' : '#f5f8fc';
    const wBorder = isClaude ? '#e5e0d4' : '#e4ebf5';

    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:;" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { --w-accent: ${wAccent}; --w-soft: ${wSoft}; --w-muted: ${wMuted}; --w-border: ${wBorder}; }
  html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; overflow-x: hidden; }
  * { box-sizing: border-box; }
</style>
<script>
  window.__WIDGET_ID__ = ${safeId};
  window.__WIDGET_TITLE__ = ${safeTitle};
  window.__INITIAL_STATE__ = ${initialStateJson};
  function __clone(obj) {
    try { return JSON.parse(JSON.stringify(obj || {})); } catch { return {}; }
  }
  window.CompanionBridge = {
    getState() { return __clone(window.__INITIAL_STATE__); },
    saveState(nextState) {
      const copy = __clone(nextState);
      window.__INITIAL_STATE__ = copy;
      parent.postMessage({ type: 'loom:saveState', widgetId: window.__WIDGET_ID__, state: copy }, '*');
    },
    emit(message, extra) {
      parent.postMessage({ type: 'loom:emit', widgetId: window.__WIDGET_ID__, title: window.__WIDGET_TITLE__, message: String(message || ''), extra: extra || null }, '*');
    }
  };
  function __reportHeight() {
    const h = Math.max(document.body ? document.body.scrollHeight : 160, 110);
    parent.postMessage({ type: 'loom:resize', widgetId: window.__WIDGET_ID__, height: Math.min(h + 6, 520) }, '*');
  }
  window.addEventListener('load', () => {
    __reportHeight();
    if (window.ResizeObserver && document.body) {
      new ResizeObserver(__reportHeight).observe(document.body);
    }
  });
<` + `/script>
</head>
<body>${bodyHtml}</body>
</html>`;
  }

  function renderWidgets() {

  // ---- Event Queue & Debounced Flush ----
  function enqueueWidgetEvent(eventText) {
    pendingEventQueue.push(eventText);
    clearTimeout(eventFlushTimer);
    eventFlushTimer = setTimeout(flushWidgetEvents, 550);
  }

  function flushWidgetEvents() {
    if (isBusy || !pendingEventQueue.length) return;
    const batch = pendingEventQueue.splice(0, pendingEventQueue.length);
    const summary = batch.length === 1
      ? batch[0]
      : batch.map((t, i) => `${i + 1}. ${t}`).join('；');
    triggerCompanionReply(
      `[系统通知：用户刚刚在你们的看板组件里互动了——${summary}。请用自然亲密的伴侣口吻简短回应，不要重复创建组件。]`,
      true
    );
  }

  window.addEventListener('message', e => {
    const data = e.data;
    if (!data || typeof data !== 'object' || !data.widgetId) return;
    const registeredIframe = iframeRegistry.get(data.widgetId);
    if (!registeredIframe || e.source !== registeredIframe.contentWindow) return;

    if (data.type === 'loom:resize' && typeof data.height === 'number') {
      registeredIframe.style.height = Math.max(110, Math.min(520, data.height)) + 'px';
    } else if (data.type === 'loom:saveState') {
      state.widgetStates[data.widgetId] = data.state;
      scheduleSave();
    } else if (data.type === 'loom:emit' && data.message) {
      const eventText = `在「${data.title}」中：${data.message}`;
      appendChatMessage({ role: 'event', text: eventText });
      scheduleSave();

      if (state.settings.autoReact) {
        enqueueWidgetEvent(eventText);
      }
    }
  });

  // ---- Output Parser ----
  function parseTagAttrs(attrStr) {
    const attrs = {};
    const re = /([a-zA-Z0-9_-]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+))/g;
    let m;
    while ((m = re.exec(attrStr || '')) !== null) {
      attrs[m[1].toLowerCase()] = m[2] ?? m[3] ?? m[4] ?? '';
    }
    return attrs;
  }

  // ---- Long-Term Memory Helpers ----
  function upsertMemory(key, value) {
    const k = String(key || '').trim().slice(0, 24);
    const v = String(value || '').trim().slice(0, 120);
    if (!k || !v) return false;
    if (!Array.isArray(state.memories)) state.memories = [];
    const idx = state.memories.findIndex(m => m.key.toLowerCase() === k.toLowerCase());
    if (idx >= 0) {
      state.memories[idx].key = k;
      state.memories[idx].value = v;
      state.memories[idx].updatedAt = Date.now();
    } else {
      state.memories.unshift({
        id: 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        key: k,
        value: v,
        updatedAt: Date.now()
      });
      if (state.memories.length > 80) state.memories = state.memories.slice(0, 80);
    }
    return true;
  }

  function removeMemoryByKey(key) {
    const k = String(key || '').trim().toLowerCase();
    if (!k || !Array.isArray(state.memories)) return;
    state.memories = state.memories.filter(m => m.key.toLowerCase() !== k);
  }

  function parseAssistantOutput(rawText) {
    let cleanText = String(rawText || '');
    const newWidgets = [];
    let hasUnclosedWidget = false;

    cleanText = cleanText.replace(/<AFFECTION\b([^>]*?)\/?>(?:<\/AFFECTION>)?/gi, (_, attrStr) => {
      const attrs = parseTagAttrs(attrStr);
      if (attrs.delta !== undefined) {
        const d = Number(attrs.delta);
        if (!Number.isNaN(d)) {
          state.affection = Math.max(0, Math.min(100, state.affection + d));
        }
      }
      if (attrs.mood) state.mood = attrs.mood;
      return '';
    });

    cleanText = cleanText.replace(/<MEMORY\b([^>]*?)\/?>(?:<\/MEMORY>)?/gi, (_, attrStr) => {
      const attrs = parseTagAttrs(attrStr);
      if (attrs.op === 'del' || attrs.op === 'delete') {
        if (attrs.key) removeMemoryByKey(attrs.key);
      } else if (attrs.key && attrs.value) {
        upsertMemory(attrs.key, attrs.value);
      }
      return '';
    });

    let resultText = '';
    let cursor = 0;
    const lower = () => cleanText.toLowerCase();

    while (cursor < cleanText.length) {
      const openIdx = lower().indexOf('<widget', cursor);
      if (openIdx === -1) {
        resultText += cleanText.slice(cursor);
        break;
      }
      const nextCh = cleanText[openIdx + 7];
      if (nextCh && !/[\s>]/.test(nextCh)) {
        resultText += cleanText.slice(cursor, openIdx + 7);
        cursor = openIdx + 7;
        continue;
      }
      const openEnd = cleanText.indexOf('>', openIdx);
      if (openEnd === -1) {
        resultText += cleanText.slice(cursor, openIdx);
        hasUnclosedWidget = true;
        break;
      }

      resultText += cleanText.slice(cursor, openIdx);
      const attrStr = cleanText.slice(openIdx + 7, openEnd);
      const closeIdx = lower().indexOf('</widget>', openEnd + 1);

      if (closeIdx === -1) {
        hasUnclosedWidget = true;
        break;
      }

      let body = cleanText.slice(openEnd + 1, closeIdx).trim();
      body = body.replace(/^```(?:html)?\s*/i, '').replace(/\s*```$/, '').trim();

      if (body) {
        const attrs = parseTagAttrs(attrStr);
        const parsedH = Number(attrs.height);
        newWidgets.push({
          id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          title: attrs.title || '专属小组件',
          replace: attrs.replace || '',
          height: !Number.isNaN(parsedH) && parsedH > 0 ? Math.max(140, Math.min(460, parsedH)) : 220,
          createdAt: Date.now(),
          html: body
        });
      }
      cursor = closeIdx + 9;
    }

    resultText = resultText
      .replace(/```(?:html)?\s*```/gi, '')
      .replace(/^\s*```(?:html)?\s*$/gim, '');

    const bubbles = resultText
      .split('|||')
      .map(s => s.trim())
      .filter(Boolean);

    if (hasUnclosedWidget) {
      bubbles.push('哎呀，组件代码写到一半被模型长度截断了，你让我再试一次吧。');
    }

    return { bubbles, newWidgets };
  }

  function formatMessageForModel(m) {
    if (m.role === 'user') {
      const txt = (m.text || '').trim();
      return { role: 'user', content: m.image ? (txt ? `[图片] ${txt}` : '[用户发送了一张图片]') : txt };
    }
    if (m.role === 'assistant') return { role: 'assistant', content: m.text };
    if (m.role === 'event') return { role: 'user', content: `[看板互动记录] ${m.text}` };
    if (m.role === 'spawn') return { role: 'assistant', content: `[已创建并挂载小组件：${m.title}]` };
    return null;
  }

  function buildConversationHistory(promptOverride, isEvent = false, budgetChars = null, allowVisionForLast = true) {
    const limit = budgetChars || state.settings.maxContextChars || 3600;
    const total = state.messages.length;
    const selected = [];
    let usedChars = 0;

    // Walk backwards within character budget (always keep at least last 4 valid messages, cap at 28)
    let windowStartIndex = total;
    for (let i = total - 1; i >= 0; i--) {
      const rawMsg = state.messages[i];
      const entry = formatMessageForModel(rawMsg);
      if (!entry || !entry.content) continue;
      const len = entry.content.length;
      if (selected.length >= 4 && (usedChars + len > limit || selected.length >= 28)) {
        break;
      }
      // Only attach multimodal image payload to the very latest user message if allowed
      const attachImage = allowVisionForLast && i === total - 1 && rawMsg.role === 'user' && rawMsg.image;
      selected.unshift({ index: i, ...entry, image: attachImage ? rawMsg.image : null, rawText: rawMsg.text || '' });
      usedChars += len;
      windowStartIndex = i;
    }

    const msgs = [];
    for (const item of selected) {
      const prev = msgs[msgs.length - 1];
      if (item.image) {
        const textPart = item.rawText || '请看看这张图片';
        const mergedText = (prev && prev.role === 'user' && typeof prev.content === 'string')
          ? `${prev.content}\n${textPart}`
          : textPart;
        const multiContent = [
          { type: 'text', text: mergedText },
          { type: 'image_url', image_url: { url: item.image } }
        ];
        if (prev && prev.role === 'user') {
          prev.content = multiContent;
        } else {
          msgs.push({ role: 'user', content: multiContent });
        }
      } else if (prev && prev.role === item.role && typeof prev.content === 'string') {
        prev.content += '\n' + item.content;
      } else {
        msgs.push({ role: item.role, content: item.content });
      }
    }

    if (promptOverride) {
      const prev = msgs[msgs.length - 1];
      // Avoid duplicating the latest event text if it's already in the trailing message
      if (isEvent && prev && prev.role === 'user' && typeof prev.content === 'string' && prev.content.includes('[看板互动记录]')) {
        prev.content += '\n（请用自然亲密的伴侣口吻简短回应上面的看板互动，不要重复创建组件。）';
      } else if (prev && prev.role === 'user' && typeof prev.content === 'string') {
        prev.content += '\n' + promptOverride;
      } else {
        msgs.push({ role: 'user', content: promptOverride });
      }
    }
    return { msgs, windowStartIndex };
  }

  function getLocalTimeContext() {
    const d = new Date();
    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const h = d.getHours();
    const period = h < 5 ? '深夜' : h < 9 ? '清晨' : h < 12 ? '上午' : h < 14 ? '中午' : h < 18 ? '下午' : h < 23 ? '晚上' : '深夜';
    const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const timeStr = `${String(h).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    return `${dateStr} ${days[d.getDay()]} ${timeStr}（${period}）`;
  }

      : '温馨柔蓝白主题：背景 #ffffff，正文 #1c2433，次级文字 #6e7a91，主色 #5b8def，浅蓝底 #eef4fd，边框 #e4ebf5';

  // ---- Live LLM Call (Browser SSE + Capacitor Native Fallback) ----
  function extractSseLines(lines, onChunk) {
    let acc = '';
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || !trimmed.startsWith('data:')) continue;
      const payload = trimmed.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const parsed = JSON.parse(payload);
        const delta = parsed.choices?.[0]?.delta?.content ?? parsed.choices?.[0]?.message?.content;
        if (typeof delta === 'string') {
          acc += delta;
          if (onChunk) onChunk(delta);
        }
      } catch {}
    }
    return acc;
  }

  let lastWindowStartIndex = 0;
  let isCompressing = false;

  function isContextLimitError(err) {
    const msg = String(err?.message || '').toLowerCase();
    return /(context|length|token|too long|exceed|maximum|limit|413)/.test(msg);
  }

  function isVisionUnsupportedError(err) {
    const msg = String(err?.message || '').toLowerCase();
    return /(vision|image_url|image|multimodal|does not support|not support.*media|content must be a string|expected a string|invalid type.*array|415|422)/.test(msg);
  }

  function isModelMarkedNonVision(modelName) {
    const m = String(modelName || '').trim().toLowerCase();
    if (!m || !Array.isArray(state.nonVisionModels)) return false;
    return state.nonVisionModels.some(item => item.toLowerCase() === m);
  }

  function markModelNonVision(modelName) {
    const m = String(modelName || '').trim();
    if (!m) return;
    if (!Array.isArray(state.nonVisionModels)) state.nonVisionModels = [];
    if (!isModelMarkedNonVision(m)) {
      state.nonVisionModels.push(m);
      scheduleSave();
    }
    updateVisionBtnState();
  }

  async function callLiveLLM(promptOverride, onStreamProgress, isEvent = false, budgetChars = null, hasPendingImg = false) {
    const { baseUrl, apiKey, model, stream } = state.settings;
    if (!baseUrl.trim() || !model.trim()) {
      throw new Error('请先在设置中填写 API Base URL 和模型名称');
    }
    const url = baseUrl.trim().replace(/\/+$/, '') + '/chat/completions';
    const allowVision = hasPendingImg && !isModelMarkedNonVision(model);
    const built = buildConversationHistory(promptOverride, isEvent, budgetChars, allowVision);
    lastWindowStartIndex = built.windowStartIndex;

    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...built.msgs
    ];

    activeAbortController = new AbortController();
    const isCapacitorNative = Boolean(window.Capacitor?.isNativePlatform?.());
    const useStream = Boolean(stream) && !isCapacitorNative;

    const res = await fetch(url, {
      method: 'POST',
      signal: activeAbortController.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey.trim()}`
      },
      body: JSON.stringify({
        model: model.trim(),
        temperature: 0.85,
        stream: useStream,
        messages
      })
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} ${errText.slice(0, 160)}`);
    }

    const contentType = res.headers.get('content-type') || '';
    if (!useStream || !res.body || contentType.includes('application/json')) {
      const rawBody = await res.text();
      try {
        const json = JSON.parse(rawBody);
        return json.choices?.[0]?.message?.content || '刚才走神了，再跟我说一遍？';
      } catch {
        const sseText = extractSseLines(rawBody.split(/\r?\n/));
        return sseText || '刚才走神了，再跟我说一遍？';
      }
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let fullText = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || '';
      fullText += extractSseLines(lines, () => {});
      if (onStreamProgress && fullText) onStreamProgress(fullText);
    }
    if (buffer.trim()) {
      fullText += extractSseLines([buffer]);
    }

    return fullText || '刚才走神了，再跟我说一遍？';
  }

  async function callLiveLLMWithRetry(promptOverride, onStreamProgress, isEvent = false, hasPendingImg = false) {
    if (hasPendingImg && isModelMarkedNonVision(state.settings.model)) {
      const err = new Error(`当前模型「${state.settings.model}」不支持识图，请在设置中切换到支持视觉的模型（如 GPT-4o / Claude / Gemini / Qwen-VL）后重试。`);
      err.isVisionNotice = true;
      throw err;
    }
    let budget = state.settings.maxContextChars || 3600;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        return await callLiveLLM(promptOverride, onStreamProgress, isEvent, budget, hasPendingImg);
      } catch (err) {
        if (hasPendingImg && isVisionUnsupportedError(err)) {
          markModelNonVision(state.settings.model);
          const vErr = new Error(`当前模型「${state.settings.model}」不支持图片输入，已为你记住该限制。以后直接发文字即可，或换一个支持视觉的模型再发图。`);
          vErr.isVisionNotice = true;
          throw vErr;
        }
        if (err.name === 'AbortError' || !isContextLimitError(err) || attempt === 2) {
          throw err;
        }
        budget = Math.max(600, Math.floor(budget / 2));
        state.settings.maxContextChars = Math.max(1800, budget);
        scheduleSave();
      }
    }
  }

  // ---- Rolling Context Compression & Fact Extraction ----
  async function maybeCompressHistory(force = false) {
    if (isCompressing) return { ok: false, reason: 'busy' };
    const { baseUrl, apiKey, model } = state.settings;
    if (!baseUrl.trim() || !apiKey.trim() || !model.trim()) {
      return { ok: false, reason: 'no_api' };
    }

    const curSummarized = Math.max(0, Math.min(state.summarizedCount || 0, state.messages.length));
    // Leave at least the latest 6 messages untouched as active short-term context
    const safeEnd = force
      ? Math.max(0, state.messages.length - 6)
      : Math.min(lastWindowStartIndex, Math.max(0, state.messages.length - 6));

    const pendingCount = safeEnd - curSummarized;
    if (!force && pendingCount < 10) return { ok: false, reason: 'few' };
    if (pendingCount < 3) return { ok: false, reason: 'few' };

    const sliceEnd = Math.min(safeEnd, curSummarized + 24);
    const chunk = state.messages.slice(curSummarized, sliceEnd)
      .map(formatMessageForModel)
      .filter(Boolean)
      .map(m => `${m.role === 'user' ? '用户' : '伴侣'}: ${m.content}`)
      .join('\n');

    if (!chunk.trim()) {
      state.summarizedCount = sliceEnd;
      scheduleSave();
      return { ok: true, moved: sliceEnd - curSummarized };
    }

    isCompressing = true;
    try {
      const existingKeys = (state.memories || []).slice(0, 30).map(m => `${m.key}:${m.value}`).join('；') || '无';
      const url = baseUrl.trim().replace(/\/+$/, '') + '/chat/completions';
      const prompt = `请把下面这段刚滑出对话窗口的旧聊天记录与原有前情提要合并压缩，并顺便提取值得长期记住的事实。

【原有前情提要】
${state.memorySummary || '（暂无）'}

【已有长期记忆】
${existingKeys}

【待归档的新增旧对话】
${chunk.slice(0, 4200)}

请严格只输出一个 JSON 对象，格式如下：
{"summary":"250字以内的连贯前情摘要，保留关键事件、情绪变化和未完成约定","facts":[{"key":"简短标签(如作息/喜好/约定)","value":"客观具体的长期事实"}]}`;

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey.trim()}`
        },
        body: JSON.stringify({
          model: model.trim(),
          temperature: 0.2,
          stream: false,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const raw = json.choices?.[0]?.message?.content || '';
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error('摘要格式解析失败');
      const parsed = JSON.parse(jsonMatch[0]);

      if (typeof parsed.summary === 'string' && parsed.summary.trim()) {
        state.memorySummary = parsed.summary.trim().slice(0, 600);
      }
      if (Array.isArray(parsed.facts)) {
        parsed.facts.forEach(f => {
          if (f && f.key && f.value) upsertMemory(f.key, f.value);
        });
      }
      state.summarizedCount = sliceEnd;
      scheduleSave();
      updateMemStats();
      return { ok: true, moved: sliceEnd - curSummarized };
    } catch (err) {
      return { ok: false, reason: err.message };
    } finally {
      isCompressing = false;
    }
  }

    chatInput.style.height = 'auto';
    if (image) clearPendingImage();

    appendChatMessage({ role: 'user', text, image: image || undefined });
    scheduleSave();
    triggerCompanionReply(text, false, Boolean(image));
  }

  sendBtn.addEventListener('click', () => handleSend());
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 112) + 'px';
  });

  document.getElementById('quickBar').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip && !isBusy) handleSend(chip.dataset.prompt);
  });

  document.getElementById('askNewWidgetBtn').onclick = () => {
    switchPage(0);
    chatInput.value = '帮我现做一个';
    chatInput.focus();
  };

  function applyTheme(theme) {
    const t = theme === 'claude' ? 'claude' : 'deepseek';
    if (document.documentElement.getAttribute('data-theme') !== t) {
      document.documentElement.setAttribute('data-theme', t);
    }
    document.querySelectorAll('#themePicker [data-theme-choice]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeChoice === t);
    });
  }

  document.getElementById('quickThemeBtn').onclick = () => {
    state.settings.theme = state.settings.theme === 'claude' ? 'deepseek' : 'claude';
    applyTheme(state.settings.theme);
    renderWidgets();
    scheduleSave();
  };

  document.querySelectorAll('#themePicker [data-theme-choice]').forEach(btn => {
    btn.onclick = () => {
      state.settings.theme = btn.dataset.themeChoice;
      applyTheme(state.settings.theme);
      renderWidgets();
      scheduleSave();
    };
  });

  // ---- Settings & Backup Modal ----
  const settingsModal = document.getElementById('settingsModal');
  const cfgBaseUrl = document.getElementById('cfgBaseUrl');
  const cfgApiKey = document.getElementById('cfgApiKey');
  const cfgModel = document.getElementById('cfgModel');
  const fetchModelsBtn = document.getElementById('fetchModelsBtn');
  const modelStatus = document.getElementById('modelStatus');
  const modelSuggestions = document.getElementById('modelSuggestions');
  let detectedModels = [];
  let keyDetectTimer = null;
  let detectSeq = 0;

  function setModelStatus(text, type = '') {
    modelStatus.textContent = text;
    modelStatus.className = 'model-status' + (type ? ' ' + type : '');
  }

  function renderModelSuggestions(filterText = '') {
    if (!detectedModels.length) {
      modelSuggestions.classList.remove('show');
      modelSuggestions.innerHTML = '';
      return;
    }
    const q = filterText.trim().toLowerCase();
    const matched = q
      ? detectedModels.filter(id => id.toLowerCase().includes(q))
      : detectedModels;
    const list = matched.slice(0, 60);
    if (!list.length) {
      modelSuggestions.classList.remove('show');
      return;
    }
    const currentVal = cfgModel.value.trim();
    modelSuggestions.innerHTML = '';
    list.forEach(id => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'model-pill' + (id === currentVal ? ' active' : '');
      btn.textContent = id;
      btn.onclick = () => {
        cfgModel.value = id;
        renderModelSuggestions('');
      };
      modelSuggestions.appendChild(btn);
    });
    modelSuggestions.classList.add('show');
  }

  async function detectAvailableModels(autoPickIfDefault = true) {
    const base = cfgBaseUrl.value.trim().replace(/\/+$/, '');
    const key = cfgApiKey.value.trim();
    if (!base || !key) {
      setModelStatus('填入 API Base URL 和 API Key 后可自动检测可用模型');
      detectedModels = [];
      renderModelSuggestions();
      return;
    }
    const mySeq = ++detectSeq;
    fetchModelsBtn.disabled = true;
    fetchModelsBtn.textContent = '检测中…';
    setModelStatus('正在查询 /models 接口…');
    try {
      const res = await fetch(`${base}/models`, {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${key}` }
      });
      if (mySeq !== detectSeq) return;
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${errText.slice(0, 80)}`);
      }
      const json = await res.json();
      if (mySeq !== detectSeq) return;
      const rawList = Array.isArray(json.data) ? json.data : (Array.isArray(json.models) ? json.models : []);
      const ids = [...new Set(rawList.map(item => (typeof item === 'string' ? item : item?.id || item?.name)).filter(Boolean))].sort();
      if (!ids.length) {
        detectedModels = [];
        renderModelSuggestions();
        setModelStatus('接口未返回模型列表，请手动填写模型名称');
        return;
      }
      detectedModels = ids;
      const cur = cfgModel.value.trim();
      if (!cur || !ids.includes(cur)) {
        const preferred = ids.find(id => /chat|deepseek|gpt|claude|gemini|qwen/i.test(id)) || ids[0];
        cfgModel.value = autoPickIfDefault ? preferred : '';
      }
      setModelStatus(`✓ 已检测到 ${ids.length} 个模型${ids.length > 60 ? '（输入关键词可筛选）' : '，点击下方即可选用'}`, 'ok');
      renderModelSuggestions('');
    } catch (err) {
      if (mySeq !== detectSeq) return;
      detectedModels = [];
      renderModelSuggestions();
      setModelStatus(`未能自动获取模型列表（${err.message}），可手动填写`, 'err');
    } finally {
      if (mySeq === detectSeq) {
        fetchModelsBtn.disabled = false;
        fetchModelsBtn.textContent = '↻ 检测可用模型';
      }
    }
  }

  fetchModelsBtn.onclick = () => detectAvailableModels(false);

  cfgApiKey.addEventListener('input', () => {
    clearTimeout(keyDetectTimer);
    if (!cfgApiKey.value.trim()) {
      detectedModels = [];
      renderModelSuggestions();
      setModelStatus('');
      return;
    }
    keyDetectTimer = setTimeout(() => detectAvailableModels(true), 750);
  });
  cfgApiKey.addEventListener('change', () => {
    clearTimeout(keyDetectTimer);
    if (cfgApiKey.value.trim()) detectAvailableModels(true);
  });
  cfgBaseUrl.addEventListener('change', () => {
    if (cfgApiKey.value.trim()) detectAvailableModels(true);
  });
  cfgModel.addEventListener('input', () => renderModelSuggestions(cfgModel.value));
  cfgModel.addEventListener('focus', () => {
    if (detectedModels.length) renderModelSuggestions('');
  });

  const memSummaryInput = document.getElementById('memSummaryInput');
  const memListEl = document.getElementById('memList');
  const memCompressStatus = document.getElementById('memCompressStatus');
  const memTabCount = document.getElementById('memTabCount');
  const modelCfgDot = document.getElementById('modelCfgDot');

  function switchSettingsTab(tabKey) {
    document.querySelectorAll('#setTabBar .set-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.setTab === tabKey);
    });
    document.querySelectorAll('#settingsModal .set-pane').forEach(pane => {
      pane.classList.toggle('active', pane.dataset.setPane === tabKey);
    });
  }

  document.querySelectorAll('#setTabBar .set-tab').forEach(btn => {
    btn.addEventListener('click', () => switchSettingsTab(btn.dataset.setTab));
  });

  function updateMemStats() {
    const memCount = Array.isArray(state.memories) ? state.memories.length : 0;
    if (memTabCount) memTabCount.textContent = memCount ? `(${memCount})` : '';
    if (modelCfgDot) {
      const missingCfg = !state.settings.apiKey.trim() || !state.settings.model.trim();
      modelCfgDot.classList.toggle('show', missingCfg);
    }
  }

  function renderMemoryModalList() {
    const list = Array.isArray(state.memories) ? state.memories : [];
    memListEl.innerHTML = '';
    if (!list.length) {
      memListEl.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:12px;text-align:center;background:var(--bg-sub);border-radius:10px;">小本本还是空的，聊到你的作息/喜好时会自动记下来</div>`;
      return;
    }
    list.forEach((m, idx) => {
      const row = document.createElement('div');
      row.className = 'mem-item';
      row.innerHTML = `
        <div style="flex:1;min-width:0;"><span class="mem-item-key">${escapeHtml(m.key)}</span><span>${escapeHtml(m.value)}</span></div>
        <button type="button" class="mini-btn danger" data-idx="${idx}" title="删除">✕</button>`;
      row.querySelector('button').onclick = () => {
        state.memories.splice(idx, 1);
        scheduleSave();
        renderMemoryModalList();
        updateMemStats();
      };
      memListEl.appendChild(row);
    });
  }

  document.getElementById('openSettingsBtn').onclick = () => {
    applyTheme(state.settings.theme);
    cfgBaseUrl.value = state.settings.baseUrl;
    cfgApiKey.value = state.settings.apiKey;
    cfgModel.value = state.settings.model;
    document.getElementById('cfgName').value = state.settings.name;
    document.getElementById('cfgPersona').value = state.settings.persona;
    document.getElementById('cfgAutoReact').checked = state.settings.autoReact;
    document.getElementById('cfgStream').checked = state.settings.stream !== false;
    memSummaryInput.value = state.memorySummary || '';
    memCompressStatus.textContent = '';
    memCompressStatus.className = 'model-status';
    if (detectedModels.length) {
      renderModelSuggestions('');
    } else if (cfgApiKey.value.trim()) {
      setModelStatus('点右上「↻ 检测可用模型」可拉取最新列表');
    } else {
      setModelStatus('');
      renderModelSuggestions();
    }
    renderMemoryModalList();
    updateMemStats();
    switchSettingsTab('companion');
    settingsModal.classList.add('show');
  };
  document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.remove('show');
  settingsModal.addEventListener('click', e => {
    if (e.target === settingsModal) settingsModal.classList.remove('show');
  });

  settingsModal.querySelectorAll('.preset-btn[data-url]').forEach(btn => {
    btn.onclick = () => {
      cfgBaseUrl.value = btn.dataset.url;
      cfgModel.value = '';
      detectedModels = [];
      renderModelSuggestions();
      if (cfgApiKey.value.trim()) {
        detectAvailableModels(true);
      } else {
        setModelStatus('填入 API Key 后会自动检测可用模型');
      }
    };
  });

  document.getElementById('saveSettingsBtn').onclick = () => {
    state.settings._v = 3;
    state.settings.baseUrl = cfgBaseUrl.value.trim();
    state.settings.apiKey = cfgApiKey.value.trim();
    state.settings.model = cfgModel.value.trim();
    state.settings.name = document.getElementById('cfgName').value.trim() || '林澈';
    state.settings.persona = document.getElementById('cfgPersona').value.trim() || DEFAULT_PERSONA;
    state.settings.autoReact = document.getElementById('cfgAutoReact').checked;
    state.settings.stream = document.getElementById('cfgStream').checked;
    state.memorySummary = memSummaryInput.value.trim().slice(0, 600);
    scheduleSave();
    renderHeader();
    renderChat();
    updateMemStats();
    settingsModal.classList.remove('show');
  };

  document.getElementById('exportDataBtn').onclick = () => {
    const exportCopy = JSON.parse(JSON.stringify(state));
    exportCopy.settings.apiKey = '';
    const blob = new Blob([JSON.stringify(exportCopy, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `roomi-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importFileInput = document.getElementById('importFileInput');
  document.getElementById('importDataBtn').onclick = () => importFileInput.click();
  importFileInput.onchange = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.messages) || !Array.isArray(parsed.widgets)) {
        throw new Error('备份文件格式不对');
      }
      const prevKey = state.settings.apiKey;
      state = Object.assign(defaultState(), parsed, {
        settings: Object.assign(defaultState().settings, parsed.settings || {})
      });
      if (!state.settings.apiKey && prevKey) state.settings.apiKey = prevKey;
      scheduleSave();
      applyTheme(state.settings.theme);
      renderHeader();
      renderChat();
      renderWidgets();
      settingsModal.classList.remove('show');
    } catch (err) {
      showWarn(`导入失败：${err.message}`);
    } finally {
      importFileInput.value = '';
    }
  };

  document.getElementById('resetAllBtn').onclick = async () => {
    if (!confirm('确定清空所有聊天记录和自定义小组件吗？')) return;
    await StorageAdapter.remove(STORE_KEY);
    state = defaultState();
    applyTheme(state.settings.theme);
    renderHeader();
    renderChat();
    renderWidgets();
    settingsModal.classList.remove('show');
  };

  document.getElementById('memAddBtn').onclick = () => {
    const kEl = document.getElementById('memNewKey');
    const vEl = document.getElementById('memNewVal');
    if (upsertMemory(kEl.value, vEl.value)) {
      kEl.value = '';
      vEl.value = '';
      scheduleSave();
      renderMemoryModalList();
      updateMemStats();
    }
  };

  document.getElementById('compressNowBtn').onclick = async () => {
    const btn = document.getElementById('compressNowBtn');
    btn.disabled = true;
    btn.textContent = '整理中…';
    memCompressStatus.textContent = '正在翻看之前的聊天并整理印象…';
    memCompressStatus.className = 'model-status';
    const res = await maybeCompressHistory(true);
    btn.disabled = false;
    btn.textContent = '↻ 帮 TA 整理一下';
    if (res.ok) {
      memSummaryInput.value = state.memorySummary || '';
      renderMemoryModalList();
      memCompressStatus.textContent = `✓ 已整理 ${res.moved} 条旧消息并更新印象`;
      memCompressStatus.className = 'model-status ok';
    } else if (res.reason === 'no_api') {
      memCompressStatus.textContent = '演示模式下无法整理，请先到「模型与数据」配置 API Key';
      memCompressStatus.className = 'model-status err';
    } else if (res.reason === 'few') {
      memCompressStatus.textContent = '目前聊得还不算多，还不需要单独整理哦';
    } else {
      memCompressStatus.textContent = `整理失败：${res.reason}`;
      memCompressStatus.className = 'model-status err';
    }
  };

  document.getElementById('clearMemBtn').onclick = () => {
    if (!confirm('确定清空 TA 的长期记忆和近期印象吗？（聊天记录不会被删除）')) return;
    state.memories = [];
    state.memorySummary = '';
    state.summarizedCount = 0;
    memSummaryInput.value = '';
    scheduleSave();
    renderMemoryModalList();
    updateMemStats();
  };

  // ---- Code Inspector Modal ----
  const codeModal = document.getElementById('codeModal');
  function openCodeModal(w) {
    document.getElementById('codeModalTitle').textContent = `${w.title} · 源码`;
    document.getElementById('codePreview').textContent = w.html;
    codeModal.classList.add('show');
  }
  document.getElementById('closeCodeBtn').onclick = () => codeModal.classList.remove('show');
  codeModal.addEventListener('click', e => {
    if (e.target === codeModal) codeModal.classList.remove('show');
  });

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  async function openExternalUrl(url) {
    const browser = window.Capacitor?.Plugins?.Browser;
    if (browser?.open) {
      try {
        await browser.open({ url });
        return;
      } catch {}
    }
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  document.querySelectorAll('[data-ext-url]').forEach(btn => {
    btn.addEventListener('click', () => openExternalUrl(btn.dataset.extUrl));
  });

  // ---- Init Async ----
  (async () => {
    try {
      const saved = await StorageAdapter.get(STORE_KEY);
      if (saved) {
        state = Object.assign(defaultState(), saved, {
          settings: Object.assign(defaultState().settings, saved.settings || {})
        });
        // Clear legacy prefilled defaults and migrate default theme to warm Claude style on v3
        if (!saved.settings || (saved.settings._v || 0) < 3) {
          if ((saved.settings?._v || 0) < 2 && !state.settings.apiKey.trim()) {
            state.settings.baseUrl = '';
            state.settings.model = '';
          }
          if (state.settings.theme === 'deepseek') {
            state.settings.theme = 'claude';
          }
          state.settings._v = 3;
          scheduleSave();
        }
      }
    } catch {}
    syncViewportHeight();
    applyTheme(state.settings.theme);
    renderHeader();
    renderChat();
    renderWidgets();

    // Android hardware/gesture back button handling via @capacitor/app
    const capApp = window.Capacitor?.Plugins?.App;
    if (capApp?.addListener) {
      let lastBackTime = 0;
      capApp.addListener('backButton', () => {
        if (imgLightbox.classList.contains('show')) {
          imgLightbox.classList.remove('show');
          return;
        }
        if (codeModal.classList.contains('show')) {
          codeModal.classList.remove('show');
          return;
        }
        if (settingsModal.classList.contains('show')) {
          settingsModal.classList.remove('show');
          return;
        }
        if (currentPage === 1) {
          switchPage(0);
          return;
        }
        const now = Date.now();
        if (now - lastBackTime < 1800) {
          capApp.exitApp();
        } else {
          lastBackTime = now;
          showWarn('再按一次返回退出 Roomi', true);
          setTimeout(() => document.getElementById('warnToast').classList.remove('show'), 1800);
        }
      });
    }
  })();
})();
</script>
</body>
</html>
